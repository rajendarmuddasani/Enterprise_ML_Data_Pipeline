[tool.poetry]
name = "p16-enterprise-ml-pipeline"
version = "1.0.0"
description = "Production-grade MLOps infrastructure for semiconductor AI/ML data processing"
authors = ["MLOps Team <mlops@company.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/your-org/P16_Enterprise_ML_Data_Pipeline"
repository = "https://github.com/your-org/P16_Enterprise_ML_Data_Pipeline"
keywords = ["mlops", "machine-learning", "data-pipeline", "spark", "kafka", "mlflow", "airflow"]

[tool.poetry.dependencies]
python = "^3.11"
pyspark = "^3.5.0"
delta-spark = "^3.0.0"
mlflow = "^2.12.0"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.0"
pandas = "^2.2.0"
numpy = "^1.26.4"
scikit-learn = "^1.4.0"
xgboost = "^2.0.3"
kafka-python = "^2.0.2"
boto3 = "^1.34.0"
psycopg2-binary = "^2.9.9"
prometheus-client = "^0.20.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
black = "^24.4.0"
isort = "^5.13.0"
pre-commit = "^3.7.0"
locust = "^2.23.0"

[tool.poetry.group.airflow.dependencies]
apache-airflow = "^2.8.0"
apache-airflow-providers-celery = "^3.6.0"
apache-airflow-providers-postgres = "^5.10.0"
apache-airflow-providers-redis = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "delta.*",
    "mlflow.*",
    "kafka.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=.",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--verbose",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
